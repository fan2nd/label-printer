# 单位为毫米。每个机型的第一项是默认规格，可选 name 自定义显示名称。
# N1 可在规格项添加 barcodes，例如 barcodes: ["实际读到的耗材编码"]。
N1:
  - name: "N1 · 12 × 25 mm 圆角亚银标签"
    width_mm: 12
    length_mm: 25
    barcodes: ["05262201"]
    cut:
      rounded: true
      combined: false
      feed_margin_mm: 1
P2:
  - width_mm: 48
    length_mm: 50
  - width_mm: 40
    length_mm: 30
PtP300bt:
  - name: "PT-P300BT · 12 mm 连续色带"
    width_mm: 12
    length_mm: 50
