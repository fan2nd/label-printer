      <text x="76" y="20">16</text><text x="76" y="36">32</text><text x="76" y="52">48</text><text x="76" y="68">64</text>
      <text x="76" y="187">16</text><text x="76" y="171">32</text><text x="76" y="155">48</text><text x="76" y="139">64</text>
