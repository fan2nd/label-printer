[package]
name = "label-printer"
version = "0.3.0"
edition = "2021"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["ble", "dep:dioxus", "dep:rfd"]
ble = ["dep:btleplug", "dep:futures", "dep:tokio", "dep:dbus"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
csv = "1.4"
png = "0.17"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
barcoders = "2.0"
directories = "6"
tempfile = "3"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
dioxus = { version = "=0.7.10", features = ["desktop"], optional = true }
rfd = { version = "0.17", optional = true }
btleplug = { version = "0.11.8", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["time", "rt", "sync"], optional = true }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"], optional = true }

[profile.release]
strip = true

[build-dependencies]
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
